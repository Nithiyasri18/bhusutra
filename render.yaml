services:
  - type: web
    name: bhusutra-api
    runtime: python
    region: singapore
    plan: starter
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bhusutra-postgres
          property: connectionString
      - key: SECRET_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false

databases:
  - name: bhusutra-postgres
    plan: basic-256mb
    region: singapore